<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-box">

    <h2>Add Student</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Student Name</label>
        <input type="text" name="name" required>

        <label>Register Number</label>
        <input type="text" name="register_no" required>

        <label>Date of Birth</label>
        <input type="date" name="dob" required>

        <h3>Marks</h3>

        <label>Tamil</label>
        <input type="number" name="tamil"
               min="0" max="100" required>

        <label>English</label>
        <input type="number" name="english"
               min="0" max="100" required>

        <label>Maths</label>
        <input type="number" name="maths"
               min="0" max="100" required>

        <label>Science</label>
        <input type="number" name="science"
               min="0" max="100" required>

        <label>Social</label>
        <input type="number" name="social"
               min="0" max="100" required>

        <button type="submit">Save Student</button>

    </form>

    <a href="{{ url_for('admin_dashboard') }}">Back</a>

</div>

</body>
</html>
